name: decafia_app
description: DECAFIA — Detección de enfermedades del café con IA
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  onnxruntime: ^1.3.1
  image_picker: ^1.1.2
  image: ^4.2.0
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  provider: ^6.1.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F4C2A"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/data/
    - assets/images/
